<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Bullion Ventures">
  <!-- Bullion Ventures LLC — cast-ingot mark. One path, evenodd counter, so it
       drops onto any background and still reads as a solid #e0b24c silhouette
       if the gradient is ever stripped. Sized to survive 16x16 in a browser
       tab: the walls are ~9 units thick in a 64 box, which is the thinnest
       stroke that doesn't fill in at tab size. -->
  <defs>
    <linearGradient id="bvGold" x1="0" y1="0" x2=".72" y2="1">
      <stop offset="0" stop-color="#f6d585"/>
      <stop offset=".55" stop-color="#e0b24c"/>
      <stop offset="1" stop-color="#b8862f"/>
    </linearGradient>
  </defs>
  <path fill="url(#bvGold)" fill-rule="evenodd"
        d="M2 54 L62 54 L51 12 L13 12 Z M13.9 45 L50.1 45 L43.9 21 L20.1 21 Z"/>
</svg>
