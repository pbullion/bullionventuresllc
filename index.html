    <!-- Every page on this site is dark. Without theme-color, iOS Safari tints
         its own surfaces — the toolbars, the safe-area insets, the rubber-band
         overscroll area — from the light-mode default, which framed the whole
         app in white on a phone. Paired with `color-scheme: dark` in
         src/index.css; the meta handles Safari's chrome, the CSS handles the
         page canvas and native controls. -->
    <meta name="theme-color" content="#0a0a0d" />
